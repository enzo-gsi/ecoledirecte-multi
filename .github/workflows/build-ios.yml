name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Patch ExpoModulesJSI for compiler compatibility
        run: |
          TARGET_HEADER="node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h"
          if [ -f "$TARGET_HEADER" ]; then
            echo "Patching SWIFT_RETURNS_RETAINED in RuntimeScheduler.h"
            sed -i '' 's/SWIFT_RETURNS_RETAINED RuntimeScheduler/RuntimeScheduler/g' "$TARGET_HEADER"
          fi

          SWIFT_MAJOR_MINOR=$(swift --version | head -n 1 | sed -E 's/.*version ([0-9]+\.[0-9]+).*/\1/')
          echo "Active Swift version: $SWIFT_MAJOR_MINOR"
          TARGET_PKG="node_modules/expo-modules-jsi/apple/Package.swift"
          if [ -f "$TARGET_PKG" ]; then
            CURRENT_TOOL_VER=$(head -n 1 "$TARGET_PKG" | sed -E 's/.*swift-tools-version: *([0-9]+\.[0-9]+).*/\1/')
            echo "ExpoModulesJSI requested tools version: $CURRENT_TOOL_VER"
            if [ "$(printf '%s\n' "$SWIFT_MAJOR_MINOR" "$CURRENT_TOOL_VER" | sort -V | head -n 1)" != "$CURRENT_TOOL_VER" ]; then
              echo "Adjusting swift-tools-version from $CURRENT_TOOL_VER to $SWIFT_MAJOR_MINOR"
              sed -i '' "1s/6.2/$SWIFT_MAJOR_MINOR/" "$TARGET_PKG"
              sed -i '' 's|\.enableUpcomingFeature("NonisolatedNonsendingByDefault"),|// .enableUpcomingFeature("NonisolatedNonsendingByDefault"),|g' "$TARGET_PKG"
              sed -i '' 's|\.enableUpcomingFeature("InferIsolatedConformances"),|// .enableUpcomingFeature("InferIsolatedConformances"),|g' "$TARGET_PKG"
            fi
          fi

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Archive (Unsigned)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag{gsub(/^[ \t]+/,"");print;exit}')
          echo "Building workspace: $WORKSPACE with scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/app.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/app.xcarchive/Products/Applications/*.app Payload/
          zip -r EcoleDirecteMulti.ipa Payload
          echo "IPA packaging complete"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoleDirecteMulti-IPA
          path: EcoleDirecteMulti.ipa
          retention-days: 14

